[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "holomed"
version = "0.1.0"
description = "HoloMed AI - Foundational Architecture"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "HoloMed AI Team" }
]
dependencies = [
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "websockets>=17.1",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0",
]
vision = [
    "opencv-python>=5.0.0.93",
    "mediapipe>=1.0.1",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
pythonpath = ["python"]
asyncio_default_fixture_loop_scope = "function"
